<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talks 2026</title>
    <style>body {
    font-family: sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    background: #f4f4f4;
    color: #333;
}

header {
    background: #333;
    color: #fff;
    padding: 1rem 0;
    text-align: center;
}

.search-container {
    margin-top: 1rem;
}

#search {
    padding: 0.5rem;
    width: 50%;
    max-width: 400px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

main {
    padding: 1rem;
    margin: 0 auto;
    max-width: 800px;
}

.talk {
    background: #fff;
    margin-bottom: 1rem;
    padding: 1rem;
    border-left: 5px solid #333;
}

.talk h2 {
    margin-top: 0;
}

.talk-meta {
    margin-bottom: 0.5rem;
}

.talk-meta span {
    margin-right: 1rem;
    font-weight: bold;
}

.talk .categories {
    margin-top: 1rem;
}

.talk .categories span {
    background: #333;
    color: #fff;
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    font-size: 0.8rem;
    margin-right: 0.5rem;
}

.break {
    text-align: center;
    margin-bottom: 1rem;
    font-style: italic;
}

footer {
    text-align: center;
    padding: 1rem 0;
    background: #333;
    color: #fff;
    position: relative;
    bottom: 0;
    width: 100%;
}
</style>
</head>
<body>
    <header>
        <h1>Tech Talks 2026</h1>
        <p>A one-day event filled with technical talks.</p>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search by category...">
        </div>
    </header>
    <main id="schedule">
        <!-- Schedule will be generated by JavaScript -->
    </main>
    <footer>
        <p>&copy; 2026 Tech Talks. All rights reserved.</p>
    </footer>
    <script>
const talks = [{"time":"10:00 - 11:00","title":"The Future of Artificial Intelligence","speakers":["Dr. Evelyn Reed"],"categories":["AI","Machine Learning"],"description":"A deep dive into the future of AI and its potential impact on society."},{"time":"11:10 - 12:10","title":"Modern JavaScript Frameworks","speakers":["John Doe","Jane Smith"],"categories":["JavaScript","Web Development"],"description":"An overview of the most popular JavaScript frameworks in 2026."},{"time":"13:10 - 14:10","title":"Cybersecurity in the Cloud","speakers":["Alice Johnson"],"categories":["Cybersecurity","Cloud"],"description":"Learn how to secure your cloud infrastructure from modern threats."},{"time":"14:20 - 15:20","title":"The Rise of Quantum Computing","speakers":["Bob Williams"],"categories":["Quantum Computing","Physics"],"description":"An introduction to the principles of quantum computing and its potential applications."},{"time":"15:30 - 16:30","title":"Building Scalable Microservices","speakers":["Charlie Brown","Lucy van Pelt"],"categories":["Microservices","Architecture"],"description":"A practical guide to designing and building scalable microservices."},{"time":"16:40 - 17:40","title":"The Ethics of Technology","speakers":["David Miller"],"categories":["Ethics","Technology"],"description":"A discussion on the ethical implications of emerging technologies."}];
document.addEventListener('DOMContentLoaded', () => {
    const schedule = document.getElementById('schedule');
    const searchInput = document.getElementById('search');

    const scheduleWithBreaks = [
        talks[0],
        { time: '11:00 - 11:10', title: 'Break', isBreak: true },
        talks[1],
        { time: '12:10 - 13:10', title: 'Lunch Break', isBreak: true },
        talks[2],
        { time: '14:10 - 14:20', title: 'Break', isBreak: true },
        talks[3],
        { time: '15:20 - 15:30', title: 'Break', isBreak: true },
        talks[4],
        { time: '16:30 - 16:40', title: 'Break', isBreak: true },
        talks[5]
    ];

    function renderSchedule(filter = '') {
        schedule.innerHTML = '';
        scheduleWithBreaks.forEach(item => {
            if (item.isBreak) {
                const breakElement = document.createElement('div');
                breakElement.className = 'break';
                breakElement.innerHTML = `<strong>${item.time}</strong> - ${item.title}`;
                schedule.appendChild(breakElement);
            } else {
                const categories = item.categories.map(c => c.toLowerCase());
                if (filter && !categories.some(c => c.includes(filter.toLowerCase()))) {
                    return;
                }

                const talkElement = document.createElement('div');
                talkElement.className = 'talk';

                let speakers = '';
                if (item.speakers && item.speakers.length > 0) {
                    speakers = `<div class="talk-meta"><span>Speakers:</span> ${item.speakers.join(', ')}</div>`;
                }

                let categoriesHTML = '';
                if (item.categories && item.categories.length > 0) {
                    categoriesHTML = `<div class="categories">
                        ${item.categories.map(cat => `<span>${cat}</span>`).join('')}
                    </div>`;
                }

                talkElement.innerHTML = `
                    <h2>${item.title}</h2>
                    <div class="talk-meta"><span>Time:</span> ${item.time}</div>
                    ${speakers}
                    <p>${item.description}</p>
                    ${categoriesHTML}
                `;
                schedule.appendChild(talkElement);
            }
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderSchedule(e.target.value);
    });

    renderSchedule();
});
